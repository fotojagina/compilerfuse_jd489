[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fotojagina-compilerfuse_jd489"
version = "0.1.0"
description = "把候选项映射到类别上，算出编译器与算子融合专家·量化位宽与精度回退的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fotojagina" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fotojagina.github.io"
Repository = "https://github.com/fotojagina/compilerfuse_jd489"
Issues = "https://github.com/fotojagina/compilerfuse_jd489/issues"

[project.scripts]
compilerfuse_jd489 = "compilerfuse_jd489:main"

[tool.setuptools]
py-modules = ["compilerfuse_jd489"]
